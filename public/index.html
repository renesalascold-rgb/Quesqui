<!-- RELOJ Y AUDIOS IGUAL QUE ANTES -->
<div id="clock">CDMX: --:--</div>
<audio id="sound-success" src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3" preload="auto"></audio>
<audio id="sound-celebration" src="https://assets.mixkit.co/active_storage/sfx/1997/1997-preview.mp3" preload="auto"></audio>

<!-- VISTA LOBBY -->
<div id="view-login" class="view active">
    <h2>Entrar a la Partida</h2>
    <input type="text" id="studentName" placeholder="Tus Apellidos y Nombre" autocomplete="off">
    <button class="btn" onclick="joinAsStudent()">Entrar como Alumno</button>
    <div class="divider"></div>
    <input type="password" id="rolePassword" placeholder="Contraseña de Host/Admin">
    <div style="display: flex; gap: 10px;">
        <button class="btn btn-secondary" onclick="loginRole('host')">Host</button>
        <button class="btn btn-secondary" onclick="loginRole('admin')">Admin</button>
    </div>
</div>

<!-- VISTA ALUMNO -->
<div id="view-student" class="view">
    <h2 id="student-status">Esperando al profesor...</h2>
    <div id="student-question-container" style="display:none;">
        <h2 id="timer-student" style="color: var(--accent);"></h2>
        <h3 id="student-question-text"></h3>
        <div id="student-options"></div>
    </div>
</div>

<!-- VISTA HOST -->
<div id="view-host" class="view" style="max-width: 800px;">
    <h2>Panel Principal</h2>
    <h1 id="timer-host" style="font-size: 3rem; color: var(--accent); display: none;"></h1>
    <p style="font-size: 1.2rem;">Alumnos conectados: <strong id="student-count" style="color: var(--accent);">0</strong> / 60</p>
    
    <div class="student-list-container">
        <ul id="student-list" style="list-style:none; padding:0; margin:0;"></ul>
    </div>
    
    <div style="display: flex; gap: 15px;">
        <button class="btn" onclick="startGame()">Iniciar Partida</button>
        <button class="btn btn-secondary" onclick="endGame()">Finalizar y Mostrar Resultados</button>
    </div>
</div>

<!-- VISTA ADMIN (BANCO DE PREGUNTAS) -->
<div id="view-admin" class="view" style="max-width: 800px;">
    <h2>Crear Pregunta</h2>
    <input type="text" id="q-text" placeholder="Escribe la pregunta aquí...">
    
    <div style="text-align: left; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; margin-bottom: 10px;">
        <p style="margin-top:0; font-size: 0.9rem; color: #ccc;">Selecciona cuál es la correcta:</p>
        <label><input type="radio" name="q-correct" value="0" checked> A: <input type="text" id="q-opt0" placeholder="Opción A (Obligatoria)"></label><br>
        <label><input type="radio" name="q-correct" value="1"> B: <input type="text" id="q-opt1" placeholder="Opción B (Obligatoria)"></label><br>
        <label><input type="radio" name="q-correct" value="2"> C: <input type="text" id="q-opt2" placeholder="Opción C"></label><br>
        <label><input type="radio" name="q-correct" value="3"> D: <input type="text" id="q-opt3" placeholder="Opción D"></label>
    </div>
    
    <input type="number" id="q-time" placeholder="Tiempo límite (segundos)" value="15">
    <button class="btn btn-secondary" onclick="saveToBank()">Guardar en el Banco</button>

    <div class="divider"></div>
    
    <h2>Banco de Preguntas</h2>
    <div class="student-list-container" style="max-height: 250px;">
        <ul id="question-bank-list" style="list-style:none; padding:0; margin:0; text-align: left;"></ul>
    </div>
</div>

<!-- VISTA RESULTADOS -->
<div id="view-results" class="view" style="max-width: 800px;">
    <h1>🏆 Ranking Final 🏆</h1>
    <div class="student-list-container" style="max-height: 400px;">
        <ul id="results-list" style="list-style:none; padding:0; margin:0;"></ul>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let questionTimerInterval;

    setInterval(() => {
        const timeCDMX = new Date().toLocaleTimeString("es-MX", { timeZone: "America/Mexico_City", hour: '2-digit', minute:'2-digit', second:'2-digit' });
        document.getElementById('clock').innerText = `CDMX: ${timeCDMX}`;
    }, 1000);

    function showView(viewId) {
        document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
    }

    function joinAsStudent() {
        const name = document.getElementById('studentName').value;
        if(!name.trim()) return alert("El nombre es obligatorio");
        socket.emit('join_student', name);
        showView('view-student');
    }

    function loginRole(role) {
        const pass = document.getElementById('rolePassword').value;
        socket.emit('login', { role: role, password: pass });
    }

    socket.on('login_success', (role) => {
        showView(`view-${role}`);
        if(role === 'admin') renderBank();
    });
    
    socket.on('login_error', (msg) => alert(msg));

    socket.on('update_participants', (participants) => {
        document.getElementById('student-count').innerText = participants.length;
        
        // Ordenamos por puntaje en tiempo real en la pantalla del Host y Admin
        const sorted = participants.sort((a, b) => b.score - a.score);
        document.getElementById('student-list').innerHTML = sorted.map(p => `<li>👤 ${p.name} - <strong>${p.score} pts</strong></li>`).join('');
    });

    function startGame() { socket.emit('start_game'); }
    function endGame() { socket.emit('end_game'); }

    // --- LÓGICA DEL BANCO DE PREGUNTAS (ADMIN) ---
    let questionBank = JSON.parse(localStorage.getItem('juego_preguntas')) || [];

    function saveToBank() {
        const qText = document.getElementById('q-text').value;
        const timeLimit = parseInt(document.getElementById('q-time').value) || 15;
        const correctIndex = parseInt(document.querySelector('input[name="q-correct"]:checked').value);
        
        const rawOptions = [
            document.getElementById('q-opt0').value,
            document.getElementById('q-opt1').value,
            document.getElementById('q-opt2').value,
            document.getElementById('q-opt3').value
        ];

        // Limpiar opciones vacías y ajustar el índice de la respuesta correcta
        const validOptions = [];
        let adjustedCorrectIndex = -1;
        
        for (let i = 0; i < rawOptions.length; i++) {
            if (rawOptions[i].trim() !== '') {
                validOptions.push(rawOptions[i]);
                if (i === correctIndex) adjustedCorrectIndex = validOptions.length - 1;
            }
        }

        if(!qText || validOptions.length < 2 || adjustedCorrectIndex === -1) {
            return alert("Debes escribir una pregunta, al menos 2 opciones y asegurarte de que la respuesta correcta seleccionada no esté vacía.");
        }

        const newQuestion = { text: qText, options: validOptions, correctIndex: adjustedCorrectIndex, timeLimit: timeLimit };
        questionBank.push(newQuestion);
        localStorage.setItem('juego_preguntas', JSON.stringify(questionBank));
        
        // Limpiar inputs
        document.getElementById('q-text').value = '';
        rawOptions.forEach((_, i) => document.getElementById(`q-opt${i}`).value = '');
        
        renderBank();
    }

    function renderBank() {
        const list = document.getElementById('question-bank-list');
        list.innerHTML = questionBank.map((q, i) => `
            <li style="border-bottom: 1px solid #444; padding: 10px 0;">
                <strong>${q.text}</strong> (${q.timeLimit}s)<br>
                <em style="font-size: 0.8rem; color:#888;">Correcta: ${q.options[q.correctIndex]}</em><br>
                <button class="btn" style="padding: 5px; width: auto; font-size: 14px; margin-top: 5px;" onclick="sendQuestion(${i})">Lanzar al Proyector</button>
                <button class="btn" style="padding: 5px; width: auto; font-size: 14px; margin-top: 5px; background: #666; box-shadow: none;" onclick="deleteQuestion(${i})">Borrar</button>
            </li>
        `).join('');
    }

    function deleteQuestion(index) {
        questionBank.splice(index, 1);
        localStorage.setItem('juego_preguntas', JSON.stringify(questionBank));
        renderBank();
    }

    function sendQuestion(index) {
        const q = questionBank[index];
        socket.emit('send_question', { question: q.text, options: q.options, correctIndex: q.correctIndex, timeLimit: q.timeLimit });
    }

    // --- LÓGICA DE TEMPORIZADOR Y RESPUESTAS ---
    socket.on('new_question', (data) => {
        clearInterval(questionTimerInterval);
        let timeLeft = data.timeLimit;
        
        // Interfaz Alumno
        document.getElementById('student-status').style.display = 'none';
        document.getElementById('student-question-container').style.display = 'block';
        document.getElementById('student-question-text').innerText = data.question;
        const optionsDiv = document.getElementById('student-options');
        optionsDiv.innerHTML = '';
        
        data.options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = `btn opt-${index % 4}`; 
            btn.innerText = opt;
            btn.onclick = () => {
                document.getElementById('sound-success').play();
                socket.emit('submit_answer', index); // Solo se envía el índice al servidor
                optionsDiv.innerHTML = '<h3 style="margin-top:20px;">Respuesta registrada. Esperando a los demás...</h3>';
            };
            optionsDiv.appendChild(btn);
        });

        // Interfaz de Tiempo en Host y Alumno
        const hostTimer = document.getElementById('timer-host');
        const studentTimer = document.getElementById('timer-student');
        hostTimer.style.display = 'block';
        
        const updateTimerDisplay = () => {
            hostTimer.innerText = `⏳ ${timeLeft}s`;
            studentTimer.innerText = `⏳ ${timeLeft}s`;
            if (timeLeft <= 0) {
                clearInterval(questionTimerInterval);
                hostTimer.innerText = "¡Tiempo agostado!";
                studentTimer.innerText = "¡Tiempo agotado!";
                optionsDiv.innerHTML = '<h3>El tiempo ha terminado.</h3>';
            }
            timeLeft--;
        };
        
        updateTimerDisplay();
        questionTimerInterval = setInterval(updateTimerDisplay, 1000);
    });

    socket.on('show_results', (participants) => {
        showView('view-results');
        document.body.classList.add('celebrate-mode');
        document.getElementById('sound-celebration').play();
        const sorted = participants.sort((a, b) => b.score - a.score);
        document.getElementById('results-list').innerHTML = sorted.map((p, i) => `<li><strong>#${i+1}</strong> ${p.name} - ${p.score} pts</li>`).join('');
    });
</script>
