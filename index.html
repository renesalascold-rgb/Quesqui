<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Juego Interactivo</title>
    <style>
        /* Variables globales para mantener consistencia */
        :root {
            --bg-color: #1a1a2e;
            --panel-bg: rgba(255, 255, 255, 0.05);
            --text-main: #ffffff;
            --accent: #e94560;
            --accent-hover: #d1304b;
            --success: #0f3460;
            --font-main: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body { 
            font-family: var(--font-main); 
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top right, #16213e, #1a1a2e);
            color: var(--text-main);
            text-align: center; 
            margin: 0; 
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Utilidad para ocultar/mostrar vistas suavemente */
        .view { 
            display: none; 
            width: 90%;
            max-width: 600px;
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            animation: fadeIn 0.3s ease-out forwards;
        }
        .active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Tipografía proyectable */
        h1, h2 { margin-top: 0; font-size: 2rem; letter-spacing: 1px; }
        h3 { font-size: 1.5rem; font-weight: 500; }

        /* Reloj HUD */
        #clock { 
            position: absolute;
            top: 20px;
            right: 20px;
            font-weight: 600; 
            font-size: 1rem; 
            color: rgba(255,255,255,0.7);
            background: rgba(0,0,0,0.3);
            padding: 8px 16px;
            border-radius: 20px;
        }

        /* Inputs modernos */
        input[type="text"], input[type="password"] { 
            width: calc(100% - 30px);
            padding: 15px; 
            font-size: 16px; 
            margin: 10px 0; 
            border: 2px solid transparent;
            border-radius: 8px;
            background: rgba(255,255,255,0.9);
            color: #333;
            transition: all 0.2s;
            outline: none;
        }
        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(233, 69, 96, 0.3);
        }

        /* Botones estilo Game UI (Efecto de presión) */
        .btn { 
            width: 100%;
            padding: 15px 20px; 
            margin: 10px 0; 
            cursor: pointer; 
            font-size: 18px; 
            font-weight: bold;
            color: white;
            background: var(--accent);
            border: none;
            border-radius: 12px;
            box-shadow: 0 6px 0 var(--accent-hover);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0 var(--accent-hover);
        }
        .btn-secondary {
            background: var(--success);
            box-shadow: 0 6px 0 #0a2545;
        }
        .btn-secondary:active {
            box-shadow: 0 0px 0 #0a2545;
        }

        /* Layout de opciones para el alumno (Grid 2x2 si hay 4 opciones, o apiladas) */
        #student-options {
            display: grid;
            gap: 15px;
            grid-template-columns: 1fr;
            margin-top: 20px;
        }
        
        /* Colores dinámicos para las opciones de respuesta */
        .opt-0 { background: #ff4757; box-shadow: 0 6px 0 #ff1e33; }
        .opt-1 { background: #2ed573; box-shadow: 0 6px 0 #1bbd5c; }
        .opt-2 { background: #1e90ff; box-shadow: 0 6px 0 #0073e6; }
        .opt-3 { background: #ffa502; box-shadow: 0 6px 0 #e69500; }
        
        /* Lista de alumnos conectadas */
        .student-list-container {
            max-height: 200px;
            overflow-y: auto;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 20px;
            text-align: left;
        }
        #student-list li, #results-list li {
            padding: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            font-size: 1.1rem;
        }
        #student-list li:last-child, #results-list li:last-child { border-bottom: none; }

        /* Separador visual */
        .divider {
            height: 1px;
            background: rgba(255,255,255,0.2);
            margin: 25px 0;
        }

        /* Celebración CSS en lugar de JS pesado */
        @keyframes pulseBg {
            0% { background-color: var(--bg-color); }
            50% { background-color: #2a0845; }
            100% { background-color: var(--bg-color); }
        }
        .celebrate-mode {
            animation: pulseBg 2s infinite;
        }
    </style>
</head>
<body>

    <div id="clock">CDMX: --:--</div>

    <audio id="sound-success" src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3" preload="auto"></audio>
    <audio id="sound-celebration" src="https://assets.mixkit.co/active_storage/sfx/1997/1997-preview.mp3" preload="auto"></audio>

    <!-- VISTA: LOBBY -->
    <div id="view-login" class="view active">
        <h2>Entrar a la Partida</h2>
        <input type="text" id="studentName" placeholder="Tus Apellidos y Nombre" autocomplete="off">
        <button class="btn" onclick="joinAsStudent()">Entrar como Alumno</button>
        
        <div class="divider"></div>
        
        <input type="password" id="rolePassword" placeholder="Contraseña de Host/Admin">
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-secondary" onclick="loginRole('host')">Host</button>
            <button class="btn btn-secondary" onclick="loginRole('admin')">Admin</button>
        </div>
    </div>

    <!-- VISTA: ALUMNO -->
    <div id="view-student" class="view">
        <h2 id="student-status">Esperando al profesor...</h2>
        <div id="student-question-container" style="display:none;">
            <h3 id="student-question-text"></h3>
            <div id="student-options"></div>
        </div>
    </div>

    <!-- VISTA: HOST (Para el proyector) -->
    <div id="view-host" class="view" style="max-width: 800px;">
        <h2>Sala de Espera</h2>
        <p style="font-size: 1.2rem;">Alumnos listos: <strong id="student-count" style="color: var(--accent); font-size: 1.5rem;">0</strong> / 60</p>
        
        <div class="student-list-container">
            <ul id="student-list" style="list-style:none; padding:0; margin:0;"></ul>
        </div>
        
        <div style="display: flex; gap: 15px;">
            <button class="btn" onclick="startGame()">Iniciar Partida</button>
            <button class="btn btn-secondary" onclick="endGame()">Mostrar Resultados Finales</button>
        </div>
    </div>

    <!-- VISTA: ADMIN -->
    <div id="view-admin" class="view">
        <h2>Panel de Control</h2>
        <input type="text" id="q-text" placeholder="Escribe la pregunta aquí...">
        <input type="text" id="q-opt1" placeholder="Opción A (Correcta por defecto)">
        <input type="text" id="q-opt2" placeholder="Opción B">
        <input type="text" id="q-opt3" placeholder="Opción C (Opcional)">
        <input type="text" id="q-opt4" placeholder="Opción D (Opcional)">
        <button class="btn" onclick="sendQuestion()">Lanzar Pregunta</button>
    </div>

    <!-- VISTA: RESULTADOS -->
    <div id="view-results" class="view" style="max-width: 800px;">
        <h1>🏆 ¡Juego Terminado! 🏆</h1>
        <div class="student-list-container" style="max-height: 400px;">
            <ul id="results-list" style="list-style:none; padding:0; margin:0;"></ul>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        // Aquí se mantiene la misma lógica JavaScript del mensaje anterior,
        // con ajustes menores para la creación dinámica de botones.
        const socket = io();

        setInterval(() => {
            const timeCDMX = new Date().toLocaleTimeString("es-MX", { timeZone: "America/Mexico_City", hour: '2-digit', minute:'2-digit', second:'2-digit' });
            document.getElementById('clock').innerText = `CDMX: ${timeCDMX}`;
        }, 1000);

        function showView(viewId) {
            document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
        }

        function joinAsStudent() {
            const name = document.getElementById('studentName').value;
            if(!name.trim()) return alert("El nombre es obligatorio");
            socket.emit('join_student', name);
            showView('view-student');
        }

        function loginRole(role) {
            const pass = document.getElementById('rolePassword').value;
            socket.emit('login', { role: role, password: pass });
        }

        socket.on('login_success', (role) => showView(`view-${role}`));
        socket.on('login_error', (msg) => alert(msg));

        socket.on('update_participants', (participants) => {
            document.getElementById('student-count').innerText = participants.length;
            document.getElementById('student-list').innerHTML = participants.map(p => `<li>👤 ${p.name}</li>`).join('');
        });

        function startGame() { socket.emit('start_game'); }
        function endGame() { socket.emit('end_game'); }
        
        function sendQuestion() {
            const q = document.getElementById('q-text').value;
            const options = [
                document.getElementById('q-opt1').value,
                document.getElementById('q-opt2').value,
                document.getElementById('q-opt3').value,
                document.getElementById('q-opt4').value
            ].filter(Boolean); // Solo envía las opciones que no estén vacías
            
            socket.emit('send_question', { question: q, options: options });
        }

        socket.on('new_question', (data) => {
            document.getElementById('student-status').style.display = 'none';
            document.getElementById('student-question-container').style.display = 'block';
            document.getElementById('student-question-text').innerText = data.question;
            
            const optionsDiv = document.getElementById('student-options');
            optionsDiv.innerHTML = '';
            
            data.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                // Asigna una clase de color diferente según el índice (opt-0, opt-1, etc.)
                btn.className = `btn opt-${index % 4}`; 
                btn.innerText = opt;
                btn.onclick = () => {
                    document.getElementById('sound-success').play();
                    optionsDiv.innerHTML = '<h3 style="margin-top:20px;">Respuesta enviada. Espera...</h3>';
                    // socket.emit('submit_answer', { answer: opt });
                };
                optionsDiv.appendChild(btn);
            });
        });

        socket.on('show_results', (participants) => {
            showView('view-results');
            document.body.classList.add('celebrate-mode'); // Activa la animación CSS de fondo
            document.getElementById('sound-celebration').play();
            
            // Ordenar por puntaje (de mayor a menor)
            const sorted = participants.sort((a, b) => b.score - a.score);
            document.getElementById('results-list').innerHTML = sorted.map((p, i) => `<li><strong>#${i+1}</strong> ${p.name} - ${p.score} pts</li>`).join('');
        });
    </script>
</body>
</html>
